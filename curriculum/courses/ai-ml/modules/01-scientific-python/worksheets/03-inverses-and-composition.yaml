id: inverses-and-composition
title: Inverses and Function Composition
lessonId: 02-functions-code-and-mathematics
order: 2
objectiveIds:
  - python.functions
instructions: |
  Show algebra and intermediate substitutions. For composition, remember that
  evaluation proceeds from the inside out.
problems:
  - id: inverse-affine
    prompt: |
      Let $f : \mathbb{R} \to \mathbb{R}$ be $f(x)=2x+3$.

      Derive a formula for $f^{-1}(x)$.
    objectiveIds:
      - python.functions
    expectedAnswer: |
      Start with $y=2x+3$ and solve for `x`:

      $$
      y-3=2x
      $$

      $$
      x=\frac{y-3}{2}
      $$

      Therefore $f^{-1}(x)=\frac{x-3}{2}$.
    requiresWork: true
    responseLines: 9
    rubric:
      - Introduces an output variable and solves the original equation for the input.
      - Subtracts `3` before dividing by `2`.
      - Gives $f^{-1}(x)=\frac{x-3}{2}$.

  - id: verify-inverse
    prompt: |
      Using $f(x)=2x+3$ and $f^{-1}(x)=\frac{x-3}{2}$, simplify:

      1. $f^{-1}(f(x))$
      2. $f(f^{-1}(x))$
    objectiveIds:
      - python.functions
    expectedAnswer: |
      Both simplify to $x$.

      $$
      f^{-1}(f(x))
      = \frac{(2x+3)-3}{2}
      = x
      $$

      $$
      f(f^{-1}(x))
      = 2\left(\frac{x-3}{2}\right)+3
      = x
      $$
    requiresWork: true
    responseLines: 10
    rubric:
      - Substitutes one function into the other in both directions.
      - Simplifies both compositions to the identity output `x`.

  - id: reciprocal-misconception
    prompt: |
      For $f(x)=2x+3$, compare $f^{-1}(x)$ with $\frac{1}{f(x)}$.

      Write both expressions and explain why the superscript `-1` on a function
      does not mean reciprocal.
    objectiveIds:
      - python.functions
    expectedAnswer: |
      $f^{-1}(x)=\frac{x-3}{2}$, while
      $\frac{1}{f(x)}=\frac{1}{2x+3}$. They are different operations.
      $f^{-1}$ denotes the mapping that undoes `f`.
    requiresWork: true
    responseLines: 6
    rubric:
      - Gives both expressions correctly.
      - Explains inverse as an undoing mapping rather than a reciprocal.

  - id: square-not-invertible-on-reals
    prompt: |
      Explain why $f : \mathbb{R} \to \mathbb{R}$ with $f(x)=x^2$ has no
      two-sided inverse $f^{-1} : \mathbb{R} \to \mathbb{R}$.

      Your explanation should address both injectivity and surjectivity.
    objectiveIds:
      - python.functions
    expectedAnswer: |
      The function is not injective because inputs such as `3` and `-3` both
      map to `9`, so an inverse could not choose one unique original input. It
      is also not surjective onto $\mathbb{R}$ because no real input maps to a
      negative real number. A two-sided inverse between the full sets therefore
      cannot exist.
    requiresWork: true
    responseLines: 8
    rubric:
      - Identifies a collision showing failure of injectivity.
      - Identifies negative real outputs as missing, showing failure of surjectivity.
      - Connects bijectivity to existence of a two-sided inverse.

  - id: restrict-square-domain
    prompt: |
      Restrict the square function so that it becomes invertible onto
      $[0,\infty)$. State the restricted function and its inverse.
    objectiveIds:
      - python.functions
    expectedAnswer: |
      One standard restriction is

      $$
      f : [0,\infty) \to [0,\infty), \qquad f(x)=x^2
      $$

      with inverse

      $$
      f^{-1}(x)=\sqrt{x}.
      $$
    requiresWork: true
    responseLines: 7
    rubric:
      - Restricts the domain to nonnegative reals.
      - Uses `[0, ∞)` as the codomain.
      - Gives square root as the inverse.

  - id: exponential-logarithm-pairs
    prompt: |
      Complete the inverse pairs:

      1. $2^3 = 8$ implies $\log_2(8) = \; ?$
      2. $2^5 = 32$ implies $\log_2(32) = \; ?$
      3. $\log_2(16)=4$ implies $2^{\,?}=16$
    objectiveIds:
      - python.functions
    expectedAnswer: |
      1. `3`
      2. `5`
      3. `4`
    requiresWork: true
    responseLines: 5
    rubric:
      - Treats base-2 logarithm as the inverse of base-2 exponentiation.
      - Completes all three inverse relationships correctly.

  - id: composition-order
    prompt: |
      Let $f(x)=2x$ and $g(x)=x+3$.

      Compute:

      1. $(g\circ f)(4)$
      2. $(f\circ g)(4)$
    objectiveIds:
      - python.functions
    expectedAnswer: |
      $$
      (g\circ f)(4)=g(f(4))=g(8)=11
      $$

      $$
      (f\circ g)(4)=f(g(4))=f(7)=14
      $$
    requiresWork: true
    responseLines: 9
    rubric:
      - Evaluates the inner function first in each composition.
      - Gets `11` for $(g\circ f)(4)$.
      - Gets `14` for $(f\circ g)(4)$.

  - id: composition-formula
    prompt: |
      Let $f(x)=3x-1$ and $g(x)=x^2$.

      Find formulas for:

      1. $(g\circ f)(x)$
      2. $(f\circ g)(x)$
    objectiveIds:
      - python.functions
    expectedAnswer: |
      $$
      (g\circ f)(x)=g(3x-1)=(3x-1)^2
      $$

      $$
      (f\circ g)(x)=f(x^2)=3x^2-1
      $$
    requiresWork: true
    responseLines: 9
    rubric:
      - Substitutes `f(x)` into `g` for the first composition.
      - Substitutes `g(x)` into `f` for the second composition.
      - Keeps the two composition orders distinct.

  - id: composition-domain-compatibility
    prompt: |
      Suppose:

      $$
      f : \mathbb{R} \to \mathbb{R}, \qquad f(x)=x-5
      $$

      and

      $$
      g : [0,\infty) \to \mathbb{R}, \qquad g(x)=\sqrt{x}.
      $$

      For which real inputs $x$ is $g(f(x))$ defined?
    objectiveIds:
      - python.functions
    expectedAnswer: |
      $g(f(x))=\sqrt{x-5}$ requires the output of `f` to lie in the domain of
      `g`, so $x-5\ge 0$. Therefore the composition is defined for $x\ge 5$.
    requiresWork: true
    responseLines: 7
    rubric:
      - Forms $g(f(x))=\sqrt{x-5}$.
      - Applies the nonnegative-domain requirement of square root.
      - Solves $x-5\ge 0$ to get $x\ge 5$.

  - id: inverse-of-composition-order
    prompt: |
      A process applies `compress` and then `encrypt`.

      1. In which order must the two operations be undone?
      2. Relate that answer to $(g\circ f)^{-1}=f^{-1}\circ g^{-1}$.
    objectiveIds:
      - python.functions
    expectedAnswer: |
      Undo `encrypt` first, then undo `compress`. If `f` is compress and `g` is
      encrypt, the forward process is $g\circ f$, and the inverse is
      $f^{-1}\circ g^{-1}$: apply $g^{-1}$ first, then $f^{-1}$.
    requiresWork: true
    responseLines: 6
    rubric:
      - Reverses the order of the original operations.
      - Correctly connects the procedural example to the inverse-composition identity.
