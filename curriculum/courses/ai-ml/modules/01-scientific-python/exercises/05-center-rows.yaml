id: numpy.center-rows
title: Center Each Row
lessonId: 05-broadcasting
order: 2
objectiveIds:
  - numpy.broadcasting
prompt: |
  Implement `center_rows(x)` so each row has its own mean subtracted from every
  value in that row.

  Use a reduction plus broadcasting. Preserve the reduced axis so the row means
  have a shape that broadcasts in the intended direction.
starterCode: |
  import numpy as np

  def center_rows(x):
      pass
tests:
  - id: centered-values
    title: Subtracts each row's own mean
    visibility: visible
    code: |
      x = np.array([[1.0, 2.0, 3.0], [10.0, 20.0, 30.0]])
      expected = np.array([[-1.0, 0.0, 1.0], [-10.0, 0.0, 10.0]])
      assert np.allclose(center_rows(x), expected)
  - id: row-means-zero
    title: Produces rows with mean zero
    visibility: visible
    code: |
      x = np.arange(20, dtype=float).reshape(4, 5)
      result = center_rows(x)
      assert result.shape == x.shape
      assert np.allclose(result.mean(axis=1), np.zeros(4))
  - id: unseen-shape
    title: Works for another rectangular array
    visibility: hidden
    code: |
      x = np.arange(18, dtype=float).reshape(6, 3)
      expected = x - x.mean(axis=1, keepdims=True)
      assert np.allclose(center_rows(x), expected)
