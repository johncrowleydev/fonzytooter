id: numpy.time-corrections
title: Broadcast One Correction per Row
lessonId: 05-broadcasting
order: 4
objectiveIds:
  - numpy.broadcasting
prompt: |
  Implement `apply_time_corrections(measurements, corrections)` where
  `measurements` has shape `(t, s)` and `corrections` arrives with shape `(t,)`.
  Subtract one correction from every sensor value at the corresponding time.

  Reshape `corrections` so its shape explicitly means one value per row.
starterCode: |
  import numpy as np

  def apply_time_corrections(measurements, corrections):
      pass
tests:
  - id: basic-corrections
    title: Applies one correction to each row
    visibility: visible
    code: |
      measurements = np.array([[10.0, 11.0], [20.0, 21.0], [30.0, 31.0]])
      corrections = np.array([1.0, 2.0, 3.0])
      expected = np.array([[9.0, 10.0], [18.0, 19.0], [27.0, 28.0]])
      assert np.allclose(apply_time_corrections(measurements, corrections), expected)
  - id: preserves-shape
    title: Preserves the measurement shape
    visibility: visible
    code: |
      measurements = np.arange(20, dtype=float).reshape(4, 5)
      corrections = np.array([0.5, 1.0, 1.5, 2.0])
      assert apply_time_corrections(measurements, corrections).shape == (4, 5)
  - id: unseen-shape
    title: Works for another number of sensors
    visibility: hidden
    code: |
      measurements = np.arange(18, dtype=float).reshape(3, 6)
      corrections = np.array([2.0, 4.0, 6.0])
      expected = measurements - corrections.reshape(-1, 1)
      assert np.allclose(apply_time_corrections(measurements, corrections), expected)
