id: numpy.build-target-shape
title: Build a Target Shape
lessonId: 03-numpy-arrays-shape-dimension-and-dtype
order: 1
objectiveIds:
  - numpy.arrays
prompt: |
  Implement `build_array()` so it returns a NumPy array containing the integers
  `0` through `11`, arranged with shape `(3, 4)`.

  Do not hard-code a nested list of all twelve values; construct the numerical
  sequence and reshape it.
starterCode: |
  import numpy as np

  def build_array():
      pass
tests:
  - id: correct-values
    title: Contains integers 0 through 11 in order
    visibility: visible
    code: |
      result = build_array()
      assert np.array_equal(result, np.arange(12)) or np.array_equal(result.ravel(), np.arange(12))
  - id: correct-shape
    title: Has shape 3 by 4
    visibility: visible
    code: |
      result = build_array()
      assert result.shape == (3, 4)
  - id: numpy-array
    title: Returns a NumPy array
    visibility: hidden
    code: |
      result = build_array()
      assert isinstance(result, np.ndarray)
