name: Deploy to jc-dev

# Required repository or jc-dev environment secrets:
# - JC_DEV_HOST
# - JC_DEV_SSH_PRIVATE_KEY
# - JC_DEV_SSH_KNOWN_HOSTS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fonzytooter-jc-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: jc-dev
    env:
      DEPLOY_HOST: ${{ secrets.JC_DEV_HOST }}
      DEPLOY_USER: ubuntu
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Linux ARM64 server
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOARCH: arm64
          GOOS: linux
        run: |
          mkdir -p ../deploy-package
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o ../deploy-package/fonzytooter \
            ./cmd/fonzytooter

      - name: Package release
        run: |
          mkdir -p deploy-package/web
          cp -R curriculum deploy-package/curriculum
          cp -R web/dist/. deploy-package/web/
          tar --create --gzip --file fonzytooter-release.tar.gz deploy-package
          sha256sum fonzytooter-release.tar.gz

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.JC_DEV_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.JC_DEV_SSH_PRIVATE_KEY }}
        run: |
          test -n "${DEPLOY_HOST}"
          test -n "${SSH_KNOWN_HOSTS}"
          test -n "${SSH_PRIVATE_KEY}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/jc-dev
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/jc-dev ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/jc-dev >/dev/null

      - name: Upload and activate release
        run: |
          remote_archive="/tmp/fonzytooter-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          archive_sha256="$(sha256sum fonzytooter-release.tar.gz | cut -d ' ' -f 1)"
          ssh_options=(-i ~/.ssh/jc-dev -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_options[@]}" fonzytooter-release.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" \
            "${remote_archive}" \
            "${archive_sha256}" \
            < deploy/jc-dev.sh

      - name: Verify public deployment
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 \
            https://fonzytooter.johncrowley.dev/healthz
