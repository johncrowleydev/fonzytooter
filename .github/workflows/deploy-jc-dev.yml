name: Deploy to jc-dev

# Required repository or jc-dev environment secrets:
# - JC_DEV_HOST
# - JC_DEV_SSH_PRIVATE_KEY
# - JC_DEV_SSH_KNOWN_HOSTS
# - JC_DEV_AWS_ACCESS_KEY_ID
# - JC_DEV_AWS_SECRET_ACCESS_KEY

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-academy-jc-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: jc-dev
    env:
      DEPLOY_HOST: ${{ secrets.JC_DEV_HOST }}
      DEPLOY_USER: ubuntu
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Linux ARM64 server
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOARCH: arm64
          GOOS: linux
        run: |
          mkdir -p ../deploy-package
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o ../deploy-package/helix-academy \
            ./cmd/helix-academy

      - name: Package release
        run: |
          mkdir -p deploy-package/web
          cp -R curriculum deploy-package/curriculum
          cp -R web/dist/. deploy-package/web/
          tar --create --gzip --file helix-academy-release.tar.gz deploy-package
          sha256sum helix-academy-release.tar.gz

      - name: Configure SSH
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.JC_DEV_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.JC_DEV_SSH_PRIVATE_KEY }}
        run: |
          test -n "${DEPLOY_HOST}"
          test -n "${SSH_KNOWN_HOSTS}"
          test -n "${SSH_PRIVATE_KEY}"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/jc-dev
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/jc-dev ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/jc-dev >/dev/null

      - name: Allow runner SSH ingress
        id: ssh_ingress
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.JC_DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.JC_DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_PAGER: ""
          SECURITY_GROUP_ID: sg-0a25b825526a4d0f0
        run: |
          runner_ip="$(curl --fail --silent --show-error --retry 5 https://checkip.amazonaws.com)"
          runner_ip="${runner_ip//[[:space:]]/}"
          python - "${runner_ip}" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4:
              raise SystemExit("GitHub runner did not report an IPv4 address")
          PY
          runner_cidr="${runner_ip}/32"
          aws ec2 authorize-security-group-ingress \
            --group-id "${SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${runner_cidr}"
          echo "cidr=${runner_cidr}" >> "${GITHUB_OUTPUT}"
          echo "opened=true" >> "${GITHUB_OUTPUT}"

      - name: Upload and activate release
        run: |
          remote_archive="/tmp/helix-academy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          archive_sha256="$(sha256sum helix-academy-release.tar.gz | cut -d ' ' -f 1)"
          ssh_options=(
            -i ~/.ssh/jc-dev
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o StrictHostKeyChecking=yes
          )
          scp "${ssh_options[@]}" helix-academy-release.tar.gz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${remote_archive}"
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- \
            "${GITHUB_SHA}" \
            "${GITHUB_RUN_ID}" \
            "${GITHUB_RUN_ATTEMPT}" \
            "${remote_archive}" \
            "${archive_sha256}" \
            < deploy/jc-dev.sh

      - name: Verify public deployment
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-delay 2 \
            https://helix-academy.johncrowley.dev/healthz

      - name: Remove runner SSH ingress
        if: ${{ always() && steps.ssh_ingress.outputs.opened == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.JC_DEV_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.JC_DEV_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_PAGER: ""
          SECURITY_GROUP_ID: sg-0a25b825526a4d0f0
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${SECURITY_GROUP_ID}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.ssh_ingress.outputs.cidr }}"
