name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check API boundaries
        run: npm run api:check
      - name: Generate frontend API artifacts
        run: npm run api:generate
      - name: Check frontend API artifact drift
        shell: bash
        run: |
          git -C .. diff --exit-code -- web/src/api/generated
          test -z "$(git -C .. ls-files --others --exclude-standard -- web/src/api/generated)"
      - name: Test frontend API contract
        run: npm run api:test
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
      - name: Generate OpenAPI artifact
        shell: bash
        run: go run ./cmd/openapi > ../openapi/openapi.json
      - name: Check OpenAPI artifact drift
        shell: bash
        run: |
          git -C .. diff --exit-code -- openapi/openapi.json
          test -z "$(git -C .. ls-files --others --exclude-standard -- openapi/openapi.json)"
