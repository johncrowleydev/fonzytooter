name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check API boundaries
        run: npm run api:check
      - name: Generate frontend API artifacts
        run: npm run api:generate
      - name: Check frontend API artifact drift
        shell: bash
        run: |
          git -C .. diff --exit-code -- web/src/api/generated
          test -z "$(git -C .. ls-files --others --exclude-standard -- web/src/api/generated)"
      - name: Test frontend API contract
        run: npm run api:test
      - name: Test frontend features
        run: npm test
      - name: Validate curriculum MDX
        run: npm run curriculum:mdx
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  server:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Install worksheet PDF tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc
          tectonic_archive="tectonic-0.15.0-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.15.0/${tectonic_archive}" \
            --output "/tmp/${tectonic_archive}"
          echo "dfb82876f2986862996e564fa507a9e576e0c1e3bee63c2c1bd677c2543e6407  /tmp/${tectonic_archive}" | sha256sum --check --strict
          sudo tar --extract --gzip --file "/tmp/${tectonic_archive}" --directory /usr/local/bin tectonic
          pandoc --version
          tectonic --version
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
        env:
          FONZYTOOTER_REQUIRE_PDF_TOOLS: "1"
      - name: Validate curriculum
        run: go run ./cmd/curriculum-check ../curriculum
      - name: Render worksheet curriculum
        run: go run ./cmd/worksheet-render-check ../curriculum
      - name: Build
        run: go build ./...
      - name: Generate OpenAPI artifact
        shell: bash
        run: go run ./cmd/openapi > ../openapi/openapi.json
      - name: Check OpenAPI artifact drift
        shell: bash
        run: |
          git -C .. diff --exit-code -- openapi/openapi.json
          test -z "$(git -C .. ls-files --others --exclude-standard -- openapi/openapi.json)"
